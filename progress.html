<!DOCTYPE html>
<html>
<head>
    <h1 style="text-align:center;">Student Skill Assessment</h1>
    <h2 style="text-align:center;">Track Your Skill Progress 📊</h2>
    <title>Track Your Skill</title>
    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        .progress-page {
            text-align: center;
            padding: 30px;
        }

        .graph-box {
            width: 70%;
            margin: 30px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        canvas {
            max-height: 400px;
        }

        .back {
            margin-top: 25px;
            padding: 12px 30px;
            background-color: #dc2626;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div style="
    width: 450px;
    height: 300px;
    margin: 20px auto;
    padding: 15px;
    background: white;
    border-radius: 10px;
">
    <canvas id="skillChart"></canvas>
</div>
<div style="width: 100%; text-align: center; margin-top: 25px;">
    <button onclick="location.href='dashboard.html'"
        style="padding: 10px 25px; font-size: 15px; border: none; border-radius: 5px; cursor: pointer;">
        Move to Dashboard
    </button>
</div>
<script>
const ctx = document.getElementById('skillChart');

new Chart(ctx, {
    type: 'bar',

    data: {
        labels: ['HTML', 'CSS', 'JavaScript', 'Java'],

        datasets: [{
            label: 'Skill Score (%)',
            data: [80, 70, 60, 75],
            barPercentage: 0.5,
            categoryPercentage: 0.7
        }]
    },

    options: {
        responsive: true,
        maintainAspectRatio: false,

        scales: {
            y: {
                beginAtZero: true,
                max: 100
            }
        }
    }
});
</script>

<script>
    const ctx = document.getElementById('skillChart');

    new Chart(ctx, {
        type: 'bar',

        data: {
            labels: ['HTML', 'CSS', 'JavaScript'],

            datasets: [{
                label: 'Skill Progress (%)',
                data: [80, 70, 60]
            }]
        },

        options: {
            datasets:{
                bar:{
                    barPercentage:40,
                    categoryPercentage:0.5
                }
            }
            scales: {
                y: {
                    beginAtZero: true,
                    max: 100
                }
            }
        }
    });
</script>

</body>
</html>
