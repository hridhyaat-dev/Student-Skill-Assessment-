<!DOCTYPE html>
<html>
<head>
    <title>My Skills</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .skills-container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .skill-card {
            width: 220px;
            padding: 20px;
            background-color: white;
            color: black;
            border-radius: 10px;
        }

        .back-button {
            margin-top: 30px;
        }
    </style>
</head>

<body>

<div style="text-align:center; padding:30px;">

    <h1>Student Skill Assessment</h1>
    <h2>🎯 My Skills</h2>

    <div class="skills-container">

        <div class="skill-card">
            <h3>HTML</h3>
            <p>Skill Level: 80%</p>
        </div>

        <div class="skill-card">
            <h3>CSS</h3>
            <p>Skill Level: 70%</p>
        </div>

        <div class="skill-card">
            <h3>JavaScript</h3>
            <p>Skill Level: 60%</p>
        </div>

        <div class="skill-card">
            <h3>Java</h3>
            <p>Skill Level: 75%</p>
        </div>

    </div>

    <div class="back-button">
        <button onclick="location.href='dashboard.html'">
            ← Back to Dashboard
        </button>
    </div>

</div>

</body>
</html>
